<script type="application/ld+json">

  "@context": "https://schema.org",

  "applicationCategory": "EducationalApplication",

}

<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="theme-color" content="#1B1712" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="Bacaloria" />
<!-- Critical fonts only on preload; other weights share files / load on demand -->
<link rel="preload" href="/fonts/amiri-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Amiri: 400 preloaded; 700 loads when bold text appears (no preload) */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/amiri-arabic-400-normal.woff2') format('woff2');}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/amiri-arabic-700-normal.woff2') format('woff2');}
/* Source Sans: 700 reuses 600 file — one download instead of two */
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/source-sans-3-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/source-sans-3-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/source-sans-3-latin-600-normal.woff2') format('woff2');}
/* Fraunces: single file for 500/600/700 */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/fraunces-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/fraunces-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/fraunces-latin-600-normal.woff2') format('woff2');}
</style>
<script>
try{
  var t=localStorage.getItem('twoTongues.theme')||'light';
  var r=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',r);
  document.documentElement.setAttribute('data-theme-pref',t);
  // Early dir/lang reduces FOUC for Arabic-first users.
  var lang=localStorage.getItem('twoTongues.appLang');
  if(lang==='ar'||(!lang&&(navigator.language||'').toLowerCase().startsWith('ar'))){
    document.documentElement.setAttribute('lang','ar');
    document.documentElement.setAttribute('dir','rtl');
  }
}catch(e){}
</script>
</head>
<body>
<div id="root">
  <main id="initial-shell" role="status" aria-live="polite" aria-busy="true" aria-label="Loading">
    <p class="initial-shell-loading">Loading</p>
  </main>
</div>
<style>
  :root {
    --paper: #FAFDFE; --card: #FFFFFF; --ink: #146C94;
    --accent-1: #19A7CE; --accent-1-soft: #D3E7EF;
    --accent-2: #146C94; --accent-2-soft: #E4EEF2;
    --muted: #7FA3B5; --muted-strong: #4A7C93; --icon-muted: #6E93A6;
    --input-bg: #F6F1F1; --border-rgb: 20,108,148;
    --success: #2D8C69; --success-bg: #E4F2ED; --success-border-rgb: 45,140,105;
    --danger: #8A3A3A; --danger-bg: #F6E7E5; --danger-border: #E3B9B4;
    --focus-rgb: 25,167,206; --meaning: #22C55E;
    --font-latin: "Source Sans 3", system-ui, sans-serif;
    --font-arabic: "Amiri", "Times New Roman", serif;
  }
  html[data-theme="dark"] {
    --paper: #0E1A20; --card: #16262E; --ink: #E8F4F8;
    --accent-1: #3FC1E8; --accent-1-soft: #163642;
    --accent-2: #6BAFD1; --accent-2-soft: #142A34;
    --muted: #7FA0AF; --muted-strong: #9BC0D0; --icon-muted: #8CB2C2;
    --input-bg: #1D2E36; --border-rgb: 140,190,205;
    --success: #59D0A2; --success-bg: #123527; --success-border-rgb: 89,208,162;
    --danger: #F0A99E; --danger-bg: #3A211E; --danger-border: #6B3A34;
    --focus-rgb: 63,193,232; --meaning: #4ADE80;
  }
  * { box-sizing: border-box; }
  html { margin: 0; padding: 0; background-color: var(--paper); overscroll-behavior-y: auto; }
  body { margin: 0; padding: 0; background-color: transparent; background-image: none;
    font-family: var(--font-latin); position: relative; z-index: 0; min-height: 100dvh; overscroll-behavior-y: auto;
    transition: background 0.35s ease, background-color 0.35s ease; }
  body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100lvh; min-height: 100%;
    z-index: -1; pointer-events: none; background-color: var(--paper);
    background-image: var(--app-bg, none), var(--app-bg-image, none);
    background-size: cover, cover; background-position: center top, center top;
    background-repeat: no-repeat, no-repeat; transform: translateZ(0); overscroll-behavior: none; }
  input:focus, textarea:focus { border-color: var(--accent-1) !important; box-shadow: 0 0 0 3px rgba(var(--focus-rgb),0.18); outline: none; }
  /* Minimal first paint: only the word Loading, centered. No logo, no card. */
  #initial-shell {
    min-height: 100dvh;
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--muted-strong);
  }
  .initial-shell-loading {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--muted-strong);
  }
</style>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
